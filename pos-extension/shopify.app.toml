# WBAM Hub — app config for Shopify CLI (extension deploys only).
# client_id is the WBAM Hub custom app created in the store org's dev dashboard.
client_id = "c5b6a7a9d41f25eb86dbb9de6d6fc937"
name = "WBAM Hub"
application_url = "https://system.webuyanymobile.com"
embedded = false

[access_scopes]
# Must mirror the app version's Required scopes (dashboard is the source of truth).
scopes = "read_products,write_products,read_inventory,write_inventory,read_orders,write_orders,read_customers,write_customers,read_locations,read_draft_orders,write_draft_orders,read_cash_tracking,read_publications,write_publications"
use_legacy_install_flow = false

[auth]
redirect_urls = ["https://system.webuyanymobile.com"]

[webhooks]
api_version = "2026-07"
